[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "Autonomous AI code review agent for GitHub PRs"
authors = [{ name = "Henry Fadeni" }]
keywords = ["github", "code-review", "langgraph", "fastapi", "celery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.9",
    "langchain-openai>=0.1.17",
    "langchain-anthropic>=0.1.23",
    "langchain-ollama>=0.1.3",
    "celery[redis]>=5.6.3",
    "flower>=2.0.0",
    "redis>=5.0.7",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "prometheus-client>=0.20.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "structlog>=24.2.0",
]

[project.urls]
Repository = "https://github.com/Protagonist01/code-review-agent"
Issues = "https://github.com/Protagonist01/code-review-agent/issues"
Documentation = "https://github.com/Protagonist01/code-review-agent#readme"

[project.scripts]
code-review-demo = "src.demo:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "build>=1.2.0",
    "pip-audit>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "infra", "evals/*.py", "evals/golden_set.jsonl", "scripts", "docs/architecture.md", "docs/deployment.md", "docs/run-cheatsheet.md", "docs/readiness-assessment.md", "docs/adr", "BUILD_BOOK.md", ".github", ".editorconfig", ".gitattributes", ".gitignore", ".dockerignore", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "pyproject.toml", "uv.lock", ".env.example", "Makefile"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80 -v"

[tool.coverage.run]
source = ["src"]
omit = ["src/agent/prompts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
