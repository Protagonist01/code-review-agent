name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.1'
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src tests evals scripts
      - run: uv run --locked ruff format --check src tests evals scripts
      - run: uv run --locked mypy src
      - run: uv run --locked pytest --cov-report=xml
      - run: uv build --no-sources
      - run: uv run --locked python scripts/check_artifacts.py
      - name: Smoke test the installed wheel outside the checkout
        run: |
          uv venv /tmp/wheel-smoke
          uv export --locked --no-dev --no-emit-project --output-file /tmp/runtime.txt
          uv pip install --python /tmp/wheel-smoke/bin/python -r /tmp/runtime.txt dist/*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/python -m src.demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-python-${{ matrix.python }}
          path: |
            dist/
            coverage.xml
          if-no-files-found: error
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.1'
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - run: uv export --locked --no-dev --no-emit-project --output-file /tmp/runtime.txt
      - run: uv run --locked pip-audit --strict --disable-pip --no-deps -r /tmp/runtime.txt
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose -f infra/docker-compose.yml config --quiet
      - run: docker build -f infra/Dockerfile -t code-review-agent:local .
      - run: docker run --rm --network none code-review-agent:local python -m src.demo
      - name: Verify API and Redis readiness
        run: |
          docker compose -f infra/docker-compose.yml up -d redis api
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/ready; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
