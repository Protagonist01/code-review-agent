groups:
  - name: code_review_agent
    rules:
      - alert: ReviewLatencyHigh
        expr: histogram_quantile(0.95, rate(review_duration_seconds_bucket[5m])) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PR review p95 latency > 60s"
          description: >-
            The 95th percentile review duration has exceeded 60 seconds
            for 5 minutes. Current value: {{ $value }}s

      - alert: WebhookErrorRateHigh
        expr: sum(rate(webhook_errors_total[5m])) / clamp_min(rate(webhook_requests_total[5m]), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Webhook error rate > 5%"
          description: >-
            More than 5% of webhook deliveries are failing over the last
            5 minutes.

      - alert: ActiveReviewsStuck
        expr: active_reviews > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 10 reviews in-flight for 10 minutes"
          description: >-
            {{ $value }} reviews have been in-flight for > 10 minutes
            — possible worker deadlock.
